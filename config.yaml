# Shared configuration for all stages of the latent reasoning counterfactual pipeline.
# Later stages add their own sections below.

model:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16

data:
  dataset: my_dataset.json
  split: original          # which side of each pair to use: original | counterfactual
  num_queries: 20

prompt:
  system: "You are a helpful assistant."
  instruction: "Answer the following question. Think step by step, explaining your reasoning, and then give your final answer on the last line in the form \"Final answer: <answer>\".\n\nQuestion: "

paths:
  output_root: outputs

# Stage 1: baseline activations h and reasoning (R, A, Z) -- Algorithm 1, steps 1-2.
stage_1:
  max_new_tokens: 512
  repetition_penalty: 1.0      # Qwen's default generation_config uses 1.05; 1.0 = pure greedy
  trajectory_dtype: bfloat16   # Z(Q) storage dtype (model computes in bf16, so this is lossless)
  smoke:
    num_queries: 1
    max_new_tokens: 64
  # divergence.py: suggested horizon K = percentile(first divergence) + margin, rounded to 8
  divergence:
    percentile: 90
    margin: 16

# Stage 2: soft rollout T_K(h) and reasoning metric G_R -- Algorithm 1, steps 3-4.
# Stage 2 checks the machinery and measures fidelity, memory and time; it reads the
# stage 1 outputs of the configured split.
stage_2:
  layer: 14                  # l: intervene on layer_l = output of decoder block l-1
  measurement_layer: 20      # s_k = residual at this layer (same convention as Z(Q))
  horizon_K_max: 256
  horizon_per_query: true    # K = min(K_max, length of that query's real generation)
  soft_temperature: 1.0      # T_s used for the gradient checks
  fidelity:
    temperatures: [0.25, 0.5, 1.0]   # soft rollouts to compare with the real greedy tokens
    windows: [16, 32, 64, 128, 256]  # report agreement over the first N steps
  grad_check:
    num_queries: 2           # first N queries get the (slower) derivative checks
    precision_check: true    # reload in fp32 and compare J_R v with the bf16 result
    seed: 0
  smoke:
    num_queries: 1
    horizon_K_max: 16
